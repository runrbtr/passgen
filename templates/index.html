<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lykilorðabúatilari</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #2a2f3a;
    --text: #e8eaed;
    --muted: #9aa1ac;
    --accent: #5b8cff;
    --accent-hover: #4574f5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    width: 100%;
    max-width: 420px;
  }
  h1 {
    font-size: 1.3rem;
    margin: 0 0 24px;
    text-align: center;
  }
  label {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .field {
    margin-bottom: 18px;
  }
  input[type="number"], select {
    width: 100%;
    padding: 10px 12px;
    background: #0f1115;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 1rem;
  }
  .complexity-group {
    display: flex;
    gap: 8px;
  }
  .complexity-group button {
    flex: 1;
    padding: 10px 0;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0f1115;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.15s;
  }
  .complexity-group button.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  button.generate {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  button.generate:hover { background: var(--accent-hover); }
  .result-row {
    margin-top: 20px;
    display: flex;
    gap: 8px;
    align-items: stretch;
  }
  .result {
    flex: 1;
    padding: 14px;
    background: #0f1115;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: "SF Mono", Menlo, monospace;
    font-size: 1.15rem;
    text-align: center;
    word-break: break-all;
    min-height: 24px;
    cursor: pointer;
    user-select: all;
  }
  .result.empty {
    color: var(--muted);
    font-family: inherit;
    font-size: 0.9rem;
  }
  .copy-btn {
    flex-shrink: 0;
    width: 48px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #0f1115;
    color: var(--muted);
    cursor: pointer;
    font-size: 1.1rem;
    transition: all 0.15s;
  }
  .copy-btn:hover:not(:disabled) {
    color: var(--text);
    border-color: var(--accent);
  }
  .copy-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .copy-btn.copied {
    color: white;
    background: var(--accent);
    border-color: var(--accent);
  }
  .hint {
    text-align: center;
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 6px;
  }
  .counter {
    margin-top: 28px;
    text-align: center;
    font-size: 0.8rem;
    color: var(--muted);
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
  .counter span {
    color: var(--text);
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🔐 Lykilorðabúatilari</h1>

    <div class="field">
      <label for="min_length">Minimum length</label>
      <input type="number" id="min_length" value="10" min="4" max="64">
    </div>

    <div class="field">
      <label>Complexity</label>
      <div class="complexity-group">
        <button type="button" class="active" data-value="basic">Basic</button>
        <button type="button" data-value="medium">Medium</button>
        <button type="button" data-value="hard">Hard</button>
      </div>
    </div>

    <button class="generate" id="generateBtn">Generate password</button>

    <div class="result-row">
      <div class="result empty" id="result">Your password will appear here</div>
      <button class="copy-btn" id="copyBtn" disabled title="Copy to clipboard">📋</button>
    </div>
    <div class="hint">Click the password to select it, or use the copy button</div>

    <div class="counter">
      Passwords generated: <span id="counter">{{ count }}</span>
    </div>
  </div>

<script>
  let complexity = "basic";

  document.querySelectorAll(".complexity-group button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".complexity-group button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      complexity = btn.dataset.value;
    });
  });

  const resultEl = document.getElementById("result");
  const copyBtn = document.getElementById("copyBtn");
  let copyResetTimer = null;

  resultEl.addEventListener("click", () => {
    if (resultEl.classList.contains("empty")) return;
    const range = document.createRange();
    range.selectNodeContents(resultEl);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  });

  copyBtn.addEventListener("click", async () => {
    if (resultEl.classList.contains("empty")) return;
    try {
      await navigator.clipboard.writeText(resultEl.textContent);
    } catch (err) {
      const range = document.createRange();
      range.selectNodeContents(resultEl);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      document.execCommand("copy");
    }
    copyBtn.textContent = "✅";
    copyBtn.classList.add("copied");
    clearTimeout(copyResetTimer);
    copyResetTimer = setTimeout(() => {
      copyBtn.textContent = "📋";
      copyBtn.classList.remove("copied");
    }, 1200);
  });

  document.getElementById("generateBtn").addEventListener("click", async () => {
    const minLength = parseInt(document.getElementById("min_length").value, 10) || 10;

    const res = await fetch("/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ complexity, min_length: minLength })
    });
    const data = await res.json();

    resultEl.textContent = data.password;
    resultEl.classList.remove("empty");
    copyBtn.disabled = false;
    document.getElementById("counter").textContent = data.count;
  });
</script>
</body>
</html>
